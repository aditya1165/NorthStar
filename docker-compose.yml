name: northstar

x-service-defaults: &service-defaults
  init: true
  restart: unless-stopped
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  backend:
    <<: *service-defaults
    image: northstar-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    expose:
      - "8000"
    volumes:
      - backend-data:/app/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    stop_grace_period: 30s
    # State lives in this process. Do not scale replicas or Uvicorn workers.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  frontend:
    <<: *service-defaults
    image: northstar-frontend:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: runtime
      args:
        VITE_API_URL: "${VITE_API_URL:-}"
        VITE_CONGESTION_WS_URL: "${VITE_CONGESTION_WS_URL:-}"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

  # Optional verifier. Normal `up` starts only the two application services.
  smoke:
    profiles: [tools]
    image: node:24-alpine
    init: true
    user: node
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    working_dir: /checks
    volumes:
      - ./scripts/docker-smoke.mjs:/checks/scripts/docker-smoke.mjs:ro
      - ./shared:/checks/shared:ro
    command: ["node", "scripts/docker-smoke.mjs", "http://frontend:8080"]
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

volumes:
  backend-data:

