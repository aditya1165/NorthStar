map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

map $uri $static_cache_control {
  default '';
  /index.html 'no-cache';
  ~^/assets/ 'public, max-age=31536000, immutable';
}

server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded resolver must be consulted again when backend is recreated.
  # A variable in proxy_pass avoids caching a container's IP for Nginx's lifetime.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;
  set $backend http://backend:8000;

  client_max_body_size 4m;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_connect_timeout 5s;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Cache-Control $static_cache_control;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Frontend liveness remains independent of backend readiness.
  location = /health {
    access_log off;
    default_type application/json;
    return 200 '{"status":"ok"}';
  }

  location = /api/health {
    proxy_pass $backend/health$is_args$args;
  }

  location ~ ^/ws(?:/|$) {
    proxy_pass $backend$request_uri;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Keep API errors as API errors, never convert them to the SPA's index.html.
  # Swagger/ReDoc and their schema are served through the same origin too.
  location ~ ^/(?:api|docs|redoc)(?:/|$)|^/openapi\.json$ {
    proxy_pass $backend$request_uri;
  }

  location /assets/ {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

